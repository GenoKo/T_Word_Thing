<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="battle-container">
  <h2 style="text-align:center;">Shop</h2>
  <div class="shopgold" style="text-align:center; margin-bottom: 10px;">
    💰Gold: <b>{{ gold }}</b>
  </div>

  <div class="world-level">
    World Level: {{ world_level }}
  </div>


  <div class="log-box" style="height:auto;">
    <pre>Buy items (adds to inventory). Leave shop to continue.</pre>
  </div>

  <div class="actions">
    <form method="POST">
      {% for it in shop_items %}
        <button type="submit"
                name="action"
                value="buy:{{ it.key }}"
                class="tooltip">

            Buy {{ it.name }} ({{ it.price }}g) — Owned: {{ it.owned }}

            <span class="tooltiptext">
              {{ it.description }}<br>
              Price: {{ it.price }} Gold
            </span>

          </button>
      {% endfor %}
    </form>
  </div>

  <div style="text-align:center; margin-top: 12px;">
    <form method="POST">
      <button type="submit" title="Leave the shop?" name="action" value="leave_shop">Leave Shop</button>
    </form>
  </div>
</div>

</body>
</html>
